<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    ol {
      counter-reset: section;
      list-style-type: none;
    }

    li::before {
      counter-increment: section;
      content: counters(section, ".") " ";
    }
  </style>
  <title>Состав персонального компьютера</title>
</head>
<body>
  <h1>Состав персонального компьютера</h1>
  <ol>
    <li>
      Системный блок
      <ol>
        <li>Материнская плата</li>
      </ol>
    </li>
    <li>Монитор</li>
    <li>Клавиатура</li>
  </ol>
</body>
</html>
