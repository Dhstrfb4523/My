<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Градиентная таблица</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gradient-container {
            max-width: 600px;
            margin: 30px auto;
            text-align: center;
            padding-right: 260px;
        }
    
        .gradient-container h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .gradient-table {
            border-collapse: collapse;
            margin: 0 auto;
            border: 2px solid #333;
        }
        .gradient-table td {
            width: 50px;
            height: 50px;
            border: 1px solid #fff;
        }
    </style>
</head>
<body>

    <div class="gradient-container">
        <h1>Градиентная таблица</h1>
        <table class="gradient-table" id="gradTable"></table>
    </div>

    <script>
        const table = document.getElementById('gradTable');
        const lightBlue = '#00BFFF';  
        const darkBlue = '#00008B';   

        for (let row = 0; row < 10; row++) 
        {
            let tr = document.createElement('tr');
            for (let col = 0; col < 10; col++) 
            {
                let td = document.createElement('td');
                if (row + col >= 9) 
                {
                    td.style.backgroundColor = darkBlue;
                } 
                else 
                {
                    td.style.backgroundColor = lightBlue;
                }
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
    </script>

</body>
</html>
