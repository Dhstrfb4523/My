<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Светофор</title>
    <style>
        .circle {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            background: gray;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .fon {
            width: 250px;
            height: 475px;
            background: black;
            position: absolute;
            left: 40%;
            border-radius: 50px;
            top: 60px;
        }
    </style>
</head>
<body>

    <p style="font-family: Arial;">Нажмите на кнопку что бы переключить светофор</p>
    <input type="button" value="Переключить" style="background: #42aaff; font-size: 20px;" onclick="change()" />
    <div class="fon" id="fon">
        <div class="circle" id="circle" style="top: 5%; background: red;"></div>
        <div class="circle" id="circle2" style="top: 35%; background: gray;"></div>
        <div class="circle" id="circle3" style="top: 65%; background: gray;"></div>
    </div>
    <script>
                function change(){
                    let c1 = document.getElementById("circle");
                    let c2 = document.getElementById("circle2");
                    let c3 = document.getElementById("circle3");

                    if (c1.style.background == "red") {
                        c2.style.background = "yellow";

                        setTimeout(function() {
                            c1.style.background = "gray"
                            c2.style.background = "gray"
                            c3.style.background = "#00ff00"
                        }, 1500);
                    }

                    else if (c1.style.background == "gray") {
                        for (let i = 0; i < 6;i++){
                            setTimeout(function(){
                                if ( i % 2 == 0){
                                    c3.style.background = "gray";
                                } else {c3.style.background = "#00ff00";
                                  }
                            }, i*400)
                        }

                        setTimeout(function(){
                            c3.style.background = "gray";
                            c2.style.background = "yellow";
                        }, 2400);


                        setTimeout(function(){
                            c1.style.background = "red";
                            c2.style.background = "gray";
                        }, 3900);
                    }
                }
    </script>
</body>
</html>
