<HTML>
<HEAD>
<TITLE>Переключатели и флажки</TITLE>
</HEAD>
<BODY>
   <h1>АНКЕТА</h1>
<FORM>
<!-- Поле ввода -->
<BR>Вше имя:<INPUT TYPE='text' VALUE=' '><BR>
<BR>Ваш пол:
<!-- Группа переключателей -->
<INPUT TYPE='radio' NAME='color'>Мужской
<INPUT TYPE='radio' NAME='color'>Женский<BR>
<!-- Группа флажков -->
<BR><B>На каком вы курсе ?</B></BR>
<BR>
<select id="course" name="course" required>
<option value="" disabled selected>Выберите курс</option>
<option value="first">первый</option>
<option value="second">второй</option>
<option value="third">третий</option>
<option value="fourth">четвёртый</option>
</select>  
<BR>
<BR><B>Какие языки программирования вы знаете ?</B></BR>
<BR><INPUT TYPE= 'checkbox' NAME='fruit'>Паскаль
<BR><INPUT TYPE= 'checkbox' NAME='fruit'>СИ
<BR><INPUT TYPE= 'checkbox' NAME='fruit'>Ассемблер<BR>
<BR><B>Напишите несколько слов о себе</B></BR>
   <BR>
   <INPUT TYPE='text' VALUE=' '>
   <BR>
   <SCRIPT>
function showData() {
    // Получаем значение имени
    var name = document.querySelector('input[name="name"]').value;
    
    // Получаем выбранный пол
    var gender = "";
    var radios = document.querySelectorAll('input[name="gender"]');
    for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) {
            gender = radios[i].value;
        }
    }
    
    // Получаем выбранный курс
    var course = document.getElementById("course").value;
    var courseText = "";
    switch(course) {
        case "first": courseText = "первый"; break;
        case "second": courseText = "второй"; break;
        case "third": courseText = "третий"; break;
        case "fourth": courseText = "четвёртый"; break;
        default: courseText = "не выбран";
    }
    
    // Получаем выбранные языки программирования
    var langs = [];
    var checkboxes = document.querySelectorAll('input[name="lang"]');
    for (var i = 0; i < checkboxes.length; i++) {
        if (checkboxes[i].checked) {
            langs.push(checkboxes[i].value);
        }
    }
    var langsText = langs.length > 0 ? langs.join(", ") : "не выбрано";
    
    // Получаем текст "о себе"
    var about = document.querySelector('textarea[name="about"]').value;
    
    // Формируем сообщение
    var message = "=== Введённая информация ===\n\n";
    message += "Имя: " + (name || "не указано") + "\n";
    message += "Пол: " + (gender || "не указан") + "\n";
    message += "Курс: " + courseText + "\n";
    message += "Языки программирования: " + langsText + "\n";
    message += "О себе: " + (about || "не указано") + "\n";
    
    // Выводим окно с информацией
    alert(message);
}
</SCRIPT>
<!-- Кнопки -->
<button>Отправка данных</button>
<button>Сброс значений полей</button>
</FORM>

</BODY>
</HTML>
