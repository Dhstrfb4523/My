<!DOCTYPE html>
<HTML>
<HEAD>
<META CHARSET="UTF-8">
<TITLE>Анкета</TITLE>
<SCRIPT>
function showData() {
    var form = document.forms[0];
    var msg = "Имя: " + form.name.value + "\n";
    
    // Пол
    for (var i = 0; i < form.gender.length; i++) {
        if (form.gender[i].checked) msg += "Пол: " + form.gender[i].value + "\n";
    }
    
    msg += "Курс: " + form.course.value + "\n";
    
    // Языки
    var langs = "";
    for (var i = 0; i < form.lang.length; i++) {
        if (form.lang[i].checked) langs += form.lang[i].value + ", ";
    }
    msg += "Языки: " + (langs || "не выбрано") + "\n";
    
    msg += "О себе: " + form.about.value;
    
    alert(msg);
}
</SCRIPT>
</HEAD>
<BODY>
<h1>АНКЕТА</h1>
<FORM>
<BR>Ваше имя: <INPUT TYPE='text' NAME='name'><BR>

<BR>Ваш пол:
<INPUT TYPE='radio' NAME='gender' VALUE='Мужской'>Мужской
<INPUT TYPE='radio' NAME='gender' VALUE='Женский'>Женский<BR>

<BR><B>На каком вы курсе ?</B></BR>
<select NAME="course">
<option value="первый">первый</option>
<option value="второй">второй</option>
<option value="третий">третий</option>
<option value="четвёртый">четвёртый</option>
</select><BR>

<BR><B>Какие языки программирования вы знаете ?</B></BR>
<INPUT TYPE='checkbox' NAME='lang' VALUE='Паскаль'>Паскаль<BR>
<INPUT TYPE='checkbox' NAME='lang' VALUE='СИ'>СИ<BR>
<INPUT TYPE='checkbox' NAME='lang' VALUE='Ассемблер'>Ассемблер<BR>

<BR><B>Напишите несколько слов о себе</B></BR>
<TEXTAREA NAME='about' ROWS='3' COLS='40'></TEXTAREA><BR>

<INPUT TYPE='button' VALUE='Отправка данных' ONCLICK='showData()'>
<INPUT TYPE='reset' VALUE='Сброс значений полей'>
</FORM>

<a href="index.html">Главная</a> |
<a href="Tables.html">Таблицы</a>
</BODY>
</HTML>
