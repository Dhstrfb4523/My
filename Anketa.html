<HTML>
<HEAD>
<TITLE>Переключатели и флажки</TITLE>
</HEAD>
<BODY>
   <h1>АНКЕТА</h1>
<FORM>
<!-- Поле ввода -->
<BR>Вше имя:<INPUT TYPE='text' VALUE=' '><BR>
<BR>Ваш пол:
<!-- Группа переключателей -->
<INPUT TYPE='radio' NAME='color'>Мужской
<INPUT TYPE='radio' NAME='color'>Женский<BR>
<!-- Группа флажков -->
<BR><B>На каком вы курсе ?</B></BR>
<BR>
<select id="course" name="course" required>
<option value="" disabled selected>Выберите курс</option>
<option value="first">первый</option>
<option value="second">второй</option>
<option value="third">третий</option>
<option value="fourth">четвёртый</option>
</select>
<BR>
<BR><B>Какие языки программирования вы знаете ?</B></BR>
<BR><INPUT TYPE= 'checkbox' NAME='fruit'>Паскаль
<BR><INPUT TYPE= 'checkbox' NAME='fruit'>СИ
<BR><INPUT TYPE= 'checkbox' NAME='fruit'>Ассемблер<BR>
<BR><B>Напишите несколько слов о себе</B></BR>
   <BR>
   <INPUT TYPE='text' VALUE=' '>
   <BR>
<!-- Кнопки -->
<BR><INPUT TYPE= 'button' VALUE='Отправка данных' ONCLICK=window. open('mailto:MyAddress@mail.ru');>
<BR><INPUT TYPE= 'button' VALUE='Сброс значений полей'
ONCLICK=window.open('http:\\\\www.MySite.org\\MyFoto.htm');>
</FORM>
   <a href="index.html">Главная</a>
   <div id="output"></div>

    <script>
      document.getElementById('myForm').addEventListener('submit', function(e) {
        e.preventDefault(); // останавливаем перезагрузку страницы

        // --- Переменные для данных ---
        const name = document.getElementById('name').value;
        const gender = document.querySelector('input[name="gender"]:checked').value;
        const course = document.getElementById('course').value;
        const about = document.getElementById('about').value || 'не указано';

        // Собираем языки в переменную-массив
        const languages = [];
        if (document.getElementById('lang1').checked) languages.push('Паскаль');
        if (document.getElementById('lang2').checked) languages.push('С++');
        if (document.getElementById('lang3').checked) languages.push('Ассемблер');

        const langText = languages.length ? languages.join(', ') : 'не указаны';

        // --- Вывод через переменную ---
        const outputDiv = document.getElementById('output');
        outputDiv.style.display = 'block';
        outputDiv.innerHTML = `
          <h3>Ваши данные:</h3>
          <p><strong>Имя:</strong> ${name}</p>
          <p><strong>Пол:</strong> ${gender}</p>
          <p><strong>Курс:</strong> ${course}</p>
          <p><strong>Языки:</strong> ${langText}</p>
          <p><strong>О себе:</strong> ${about}</p>
        `;
      });
    </script>
</BODY>
</HTML>
